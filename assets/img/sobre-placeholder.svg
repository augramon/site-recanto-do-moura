    <path d="M-92 -118 h150 a14 14 0 0 1 14 14 v150 a40 40 0 0 1 -40 40 h-98 a40 40 0 0 1 -40 -40 v-150 a14 14 0 0 1 14 -14 Z"/>
    <path d="M72 -78 h34 a30 30 0 0 1 30 30 v54 a30 30 0 0 1 -30 30 h-34" />
    <!-- espuma -->
