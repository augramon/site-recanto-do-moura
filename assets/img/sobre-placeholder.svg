  </g>

  <text x="500" y="616" font-family="'Segoe UI', Arial, sans-serif" font-size="40" font-weight="800" fill="#FBF6EC" text-anchor="middle" letter-spacing="-1">RECANTO DO MOURA</text>
  <text x="500" y="660" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#E8DCC4" text-anchor="middle" letter-spacing="3">AMBIENTE · SÃO CAETANO, SALVADOR</text>
  <text x="500" y="730" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#C9B894" text-anchor="middle" letter-spacing="1" opacity="0.85">Substitua por uma foto real do bar</text>
