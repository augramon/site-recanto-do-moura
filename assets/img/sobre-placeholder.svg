<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-label="Ambiente do Recanto Do Moura — substitua por foto real">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E1414"/>
      <stop offset="0.55" stop-color="#3A2419"/>
      <stop offset="1" stop-color="#1A1410"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#E8A33D" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
